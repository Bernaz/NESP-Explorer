<script>
const P=JSON.parse(document.getElementById("payload").textContent);
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},key,u8(P.ct)));
  try{sessionStorage.setItem("seqlfw",pw)}catch(_){}
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),msg=document.getElementById("msg"),go=document.getElementById("go");
f.addEventListener("submit",async e=>{e.preventDefault();go.disabled=true;msg.style.color="var(--muted)";msg.textContent="Opening...";
  try{await open(document.getElementById("pw").value)}catch(_){msg.style.color="";msg.textContent="That password didn't work. Check it and try again.";go.disabled=false}});
let saved=null;try{saved=sessionStorage.getItem("seqlfw")}catch(_){}
if(saved) open(saved).catch(()=>{try{sessionStorage.removeItem("seqlfw")}catch(_){}});
</script>
